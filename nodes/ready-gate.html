<!-- Node-RED only recognises a local node .js file when a sibling .html
     exists. The admin editor is disabled for this deployment, so this file
     exists purely to make nodes/ready-gate.js part of the palette scan. -->
<script type="text/javascript">
    RED.nodes.registerType('ready-gate', {
        category: 'config',
        color: '#E2D96E',
        defaults: {
            name: {value: ''}
        },
        label: function() {
            return this.name || 'ready gate';
        }
    });
</script>
